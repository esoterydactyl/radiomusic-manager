<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/ecotone.css" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Radiomusic Manager</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <main class="app">
      <header class="masthead">
        <div class="wordmark">Radiomusic <span class="e">Manager</span></div>
        <div class="eyebrow">Music Thing Modular &middot; Radio Music card</div>
      </header>
      <form class="scan-form" id="scan-form">
        <label class="label-mono" for="scan-path">Card path</label>
        <input id="scan-path" placeholder="/Volumes/SDCARD" spellcheck="false" autocomplete="off" />
        <button type="submit" class="cta">Scan</button>
      </form>
      <p class="summary" id="scan-summary"></p>
      <ul class="warnings" id="scan-warnings"></ul>
      <table class="results">
        <thead>
          <tr>
            <th>Bank</th><th>File</th><th>Title</th><th>Artist</th><th>Length</th><th>Format</th><th>Notes</th>
          </tr>
        </thead>
        <tbody id="scan-results"></tbody>
      </table>
    </main>
  </body>
</html>
