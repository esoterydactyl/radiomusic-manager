<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/ecotone/ecotone.css" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Radiomusic Manager</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <main class="app">
      <header class="masthead">
        <div class="wordmark">Radiomusic <span class="e">Manager</span></div>
        <div class="eyebrow">Music Thing Modular &middot; Radio Music card</div>
      </header>
      <section class="card-bar">
        <label class="label-mono" for="volume-select">Card</label>
        <select id="volume-select"></select>
        <button type="button" class="btn" id="rescan">Rescan</button>
      </section>
      <section class="options">
        <label class="check"><input type="checkbox" id="auto-select" checked /> Auto-select when one usable card is found</label>
        <label class="check"><input type="checkbox" id="show-all" /> Show non-removable volumes</label>
      </section>
      <p class="card-info" id="card-info"></p>
      <ul class="warnings" id="card-warnings"></ul>
      <p class="summary" id="scan-summary"></p>
      <ul class="warnings" id="scan-warnings"></ul>
      <div class="table-scroll short"><table class="results">
        <thead>
          <tr>
            <th>Bank</th><th>File</th><th>Length</th><th>Format</th>
          </tr>
        </thead>
        <tbody id="scan-results"></tbody>
      </table></div>
    <section class="source">
        <header class="section-head">
          <div class="eyebrow">Source library</div>
        </header>
        <div class="card-bar">
          <button type="button" class="btn" id="choose-source">Choose folder…</button>
          <span class="path" id="source-path">No folder selected</span>
          <button type="button" class="btn" id="rescan-source" disabled>Rescan</button>
        </div>
        <section class="filters" id="source-filters">
          <input type="search" id="f-search" placeholder="Search file name or folder…" spellcheck="false" autocomplete="off" />
          <label class="field"><span class="label-mono">Min</span><input type="text" id="f-min" placeholder="0:00" size="5" inputmode="numeric" /></label>
          <label class="field"><span class="label-mono">Max</span><input type="text" id="f-max" placeholder="any" size="5" inputmode="numeric" /></label>
          <label class="field"><span class="label-mono">Format</span>
            <select id="f-format"><option value="">Any</option><option value="wav">WAV</option><option value="aiff">AIFF</option><option value="raw">RAW</option></select>
          </label>
          <label class="check"><input type="checkbox" id="show-ineligible" /> Show ineligible</label>
          <button type="button" class="btn" id="f-clear" disabled>Clear</button>
        </section>
        <p class="summary" id="source-summary"></p>
        <div class="source-layout">
          <nav class="tree" id="source-tree" aria-label="Source folders"></nav>
          <div class="table-scroll"><table class="results">
          <thead>
            <tr>
              <th data-sort="file">File</th><th data-sort="length">Length</th><th>Format</th>
            </tr>
          </thead>
          <tbody id="source-results"></tbody>
        </table></div>
        </div>
      </section>
    <section class="build">
        <header class="section-head">
          <div class="eyebrow">Build card</div>
        </header>
        <div class="format-bar">
          <span class="label-mono">Card format</span>
          <span class="format-info" id="fmt-info">No card selected</span>
          <label class="field"><span class="label-mono">Label</span>
            <input type="text" id="fmt-label" value="RADIOMUSIC" size="12" maxlength="11" spellcheck="false" autocomplete="off" />
          </label>
          <button type="button" class="btn danger" id="fmt-open" disabled>Format card…</button>
        </div>
        <div class="format-confirm" id="fmt-confirm" hidden>
          <p id="fmt-warning"></p>
          <div class="format-confirm-row">
            <input type="text" id="fmt-typed" size="16" spellcheck="false" autocomplete="off" />
            <button type="button" class="btn danger" id="fmt-go" disabled>Erase and format</button>
            <button type="button" class="btn" id="fmt-cancel">Cancel</button>
          </div>
        </div>
        <div class="build-controls">
          <label class="field"><span class="label-mono">Banks</span>
            <input type="range" id="b-banks" min="1" max="16" value="1" />
            <output id="b-banks-out">1</output>
          </label>
          <label class="field"><span class="label-mono">Files per bank</span>
            <input type="text" id="b-per" value="250" size="4" inputmode="numeric" />
          </label>
          <button type="button" class="btn" id="b-roll" disabled>Roll</button>
          <button type="button" class="cta" id="b-write" disabled>Write to card</button>
        </div>
        <p class="summary" id="b-pool"></p>
        <p class="summary" id="b-status"></p>
        <ul class="warnings" id="b-warnings"></ul>
        <div class="build-plan">
          <table class="results" id="b-banks-table">
            <thead><tr><th>Bank</th><th>Files</th><th>Size</th></tr></thead>
            <tbody id="b-banks-body"></tbody>
          </table>
          <div class="table-scroll short"><table class="results">
            <thead><tr><th>Bank</th><th>Will be written as</th><th>From</th></tr></thead>
            <tbody id="b-files-body"></tbody>
          </table></div>
        </div>
      </section>
    </main>
  </body>
</html>
